spring:
  application:
    name: backend

  datasource:
    # Local defaults; production sets DB_URL / DB_USERNAME / DB_PASSWORD as environment variables
    url: ${DB_URL:jdbc:postgresql://localhost:5432/splitledger}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Local DB already has tables from the ddl-auto days: mark V1 as done instead of running it.
    # (Ignored on an empty database such as Neon; the prod profile turns it off.)
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${PORT:8080}              # Render provides PORT

app:
  timezone: Asia/Kolkata            # the timezone your users live in
  salary-reminder:
    cron: "0 0 9 * * *"
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000   # 24 hours
  google:
    client-id: ${GOOGLE_CLIENT_ID}   # public identifier, not a secret: it only says who a Google token must be issued for
  cors:
    # comma-separated list; production sets CORS_ALLOWED_ORIGINS to the Vercel URL
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
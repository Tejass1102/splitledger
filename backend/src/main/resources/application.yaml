spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/splitledger
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  timezone: Asia/Kolkata            # the timezone your users live in
  salary-reminder:
    cron: "0 0 9 * * *"
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000   # 24 hours
  google:
    client-id: ${GOOGLE_CLIENT_ID}   # public identifier, not a secret: it only says who a Google token must be issued for